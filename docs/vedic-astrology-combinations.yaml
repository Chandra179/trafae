# =============================================================================
# Vedic astrology — complete combination space
# Machine-readable companion to docs/vedic-astrology-calculations.md (§10).
#
# WHY A PRODUCT, NOT A LIST: the full combination space of a Vedic chart is
# the Cartesian product of the domains below. Even the coarsest grid (sign
# level) has 12^9 = 5,159,780,352 combinations — listing rows would need
# ~100 GB of text. So this file DEFINES the space: it enumerates every domain
# completely (9 grahas, 12 rashis, 27 nakshatras, dasha cycle, vargas) and
# gives the exact cardinality at each grid size. Any individual chart is one
# assignment of a sidereal longitude to each independent axis; every coarser
# label (sign, nakshatra, pada, house, varga, dasha) is derived from it.
# =============================================================================

meta:
  title: Vedic astrology combination space
  companion_doc: ./vedic-astrology-calculations.md
  schema_version: 1
  conventions:
    ayanamsa: lahiri          # Chitrapaksha; Calendar Reform Committee 1956
    node: true                # "true node"; mean node differs by up to ~1.5°
    houses: whole_sign        # bhava chalit overlay not modelled here
    dasha_year_days: 365.2425 # some schools use 360
    angles: "sidereal ecliptic longitude, absolute 0–360°"

# --- Dimension 1: grahas ------------------------------------------------------
# 9 bodies, but only 8 are independent: ketu is always exactly rahu + 180°.
grahas:
  - {id: surya,   english: Sun,                    independent: true}
  - {id: chandra, english: Moon,                   independent: true}
  - {id: mangala, english: Mars,                   independent: true}
  - {id: budha,   english: Mercury,                independent: true}
  - {id: guru,    english: Jupiter,                independent: true}
  - {id: shukra,  english: Venus,                  independent: true}
  - {id: shani,   english: Saturn,                 independent: true}
  - {id: rahu,    english: Rahu (ascending node),  independent: true}
  - {id: ketu,    english: Ketu (descending node), independent: false,
     rule: "ketu = (rahu + 180) mod 360"}

# --- Dimension 2: rashis (signs) — 12 × 30° -----------------------------------
rashis:
  - {index: 1,  id: mesha,     english: Aries,       start_deg: 0}
  - {index: 2,  id: vrishabha, english: Taurus,      start_deg: 30}
  - {index: 3,  id: mithuna,   english: Gemini,      start_deg: 60}
  - {index: 4,  id: karka,     english: Cancer,      start_deg: 90}
  - {index: 5,  id: simha,     english: Leo,         start_deg: 120}
  - {index: 6,  id: kanya,     english: Virgo,       start_deg: 150}
  - {index: 7,  id: tula,      english: Libra,       start_deg: 180}
  - {index: 8,  id: vrischika, english: Scorpio,     start_deg: 210}
  - {index: 9,  id: dhanu,     english: Sagittarius, start_deg: 240}
  - {index: 10, id: makara,    english: Capricorn,   start_deg: 270}
  - {index: 11, id: kumbha,    english: Aquarius,    start_deg: 300}
  - {index: 12, id: meena,     english: Pisces,      start_deg: 330}

# --- Dimension 3: nakshatras — 27 × 13°20′ ------------------------------------
# start_deg = (index - 1) * 13.3333333333. Exact span is 800 arcmin (13°20′);
# one pada is 200 arcmin (3°20′), so pada k of nakshatra i covers
# [(i-1)*800 + (k-1)*200, (i-1)*800 + k*200) arcmin of the absolute zodiac.
# Lord of nakshatra i = nakshatra_lord_cycle[(i-1) mod 9].
nakshatra_lord_cycle: [ketu, shukra, surya, chandra, mangala, rahu, guru, shani, budha]
nakshatras:
  - {index: 1,  id: ashwini,           lord: ketu,    start_deg: 0.0}
  - {index: 2,  id: bharani,           lord: shukra,  start_deg: 13.3333}
  - {index: 3,  id: krittika,          lord: surya,   start_deg: 26.6667}
  - {index: 4,  id: rohini,            lord: chandra, start_deg: 40.0}
  - {index: 5,  id: mrigashira,        lord: mangala, start_deg: 53.3333}
  - {index: 6,  id: ardra,             lord: rahu,    start_deg: 66.6667}
  - {index: 7,  id: punarvasu,         lord: guru,    start_deg: 80.0}
  - {index: 8,  id: pushya,            lord: shani,   start_deg: 93.3333}
  - {index: 9,  id: ashlesha,          lord: budha,   start_deg: 106.6667}
  - {index: 10, id: magha,             lord: ketu,    start_deg: 120.0}
  - {index: 11, id: purva_phalguni,    lord: shukra,  start_deg: 133.3333}
  - {index: 12, id: uttara_phalguni,   lord: surya,   start_deg: 146.6667}
  - {index: 13, id: hasta,             lord: chandra, start_deg: 160.0}
  - {index: 14, id: chitra,            lord: mangala, start_deg: 173.3333}
  - {index: 15, id: swati,             lord: rahu,    start_deg: 186.6667}
  - {index: 16, id: vishakha,          lord: guru,    start_deg: 200.0}
  - {index: 17, id: anuradha,          lord: shani,   start_deg: 213.3333}
  - {index: 18, id: jyeshtha,          lord: budha,   start_deg: 226.6667}
  - {index: 19, id: mula,              lord: ketu,    start_deg: 240.0}
  - {index: 20, id: purva_ashadha,     lord: shukra,  start_deg: 253.3333}
  - {index: 21, id: uttara_ashadha,    lord: surya,   start_deg: 266.6667}
  - {index: 22, id: shravana,          lord: chandra, start_deg: 280.0}
  - {index: 23, id: dhanishta,         lord: mangala, start_deg: 293.3333}
  - {index: 24, id: shatabhisha,       lord: rahu,    start_deg: 306.6667}
  - {index: 25, id: purva_bhadrapada,  lord: guru,    start_deg: 320.0}
  - {index: 26, id: uttara_bhadrapada, lord: shani,   start_deg: 333.3333}
  - {index: 27, id: revati,            lord: budha,   start_deg: 346.6667}

# --- Dimension 4: bhavas (houses) — derived, whole-sign -----------------------
bhavas:
  system: whole_sign
  count: 12
  rule: "house = ((rashi_index(graha) - rashi_index(ascendant)) mod 12) + 1"
  derived: true   # adds no independent state to the space

# --- Vimshottari dasha --------------------------------------------------------
# The Moon's nakshatra lord rules at birth; balance = (1 - elapsed_fraction)
# × years(lord). Periods then follow the fixed cycle below, in order.
vimshottari:
  total_years: 120
  cycle:
    - {lord: ketu,    years: 7}
    - {lord: shukra,  years: 20}
    - {lord: surya,   years: 6}
    - {lord: chandra, years: 10}
    - {lord: mangala, years: 7}
    - {lord: rahu,    years: 18}
    - {lord: guru,    years: 16}
    - {lord: shani,   years: 19}
    - {lord: budha,   years: 17}
  distinct_timelines: 27   # one per Moon nakshatra (continuous balance within)

# --- Vargas (divisional charts) — derived projections -------------------------
# Each re-projects the same sidereal longitude into finer sign assignments
# (uniform rule, e.g. D9: navamsa_sign = floor(lon / 3.3333) mod 12).
# They add interpretive depth, never new degrees of freedom.
vargas:
  - {id: D1,  name: rashi,          divisions: 1}
  - {id: D2,  name: hora,           divisions: 2}
  - {id: D3,  name: drekkana,       divisions: 3}
  - {id: D4,  name: chaturthamsa,   divisions: 4}
  - {id: D7,  name: saptamsa,       divisions: 7}
  - {id: D9,  name: navamsa,        divisions: 9}
  - {id: D10, name: dashamsa,       divisions: 10}
  - {id: D12, name: dwadasamsa,     divisions: 12}
  - {id: D16, name: shodasamsa,     divisions: 16}
  - {id: D20, name: vimsamsa,       divisions: 20}
  - {id: D24, name: chaturvimsamsa, divisions: 24}
  - {id: D27, name: bhamsa,         divisions: 27}
  - {id: D30, name: trimsamsa,      divisions: 30}
  - {id: D40, name: khavedamsa,     divisions: 40}
  - {id: D45, name: akshavedamsa,   divisions: 45}
  - {id: D60, name: shashtiamsa,    divisions: 60}

# --- The combination space ----------------------------------------------------
combination_space:
  independent_axes:
    graha_longitudes: 8   # 9 grahas minus ketu (fixed opposite rahu)
    ascendant: 1
  rule: >-
    one chart = one sidereal longitude per independent axis (plus the
    ascendant); all labels below are pure functions of those numbers.
  cardinality_by_grid:
    - grid: rashi (12 states per axis)
      formula: "12^9"
      exact: 5159780352
      approx: 5.16e9
    - grid: nakshatra (27 states per axis)
      formula: "27^9"
      exact: 7625597484987
      approx: 7.63e12
    - grid: pada (108 states per axis) — finest standard grid
      formula: "108^9"
      exact: 1999004627104432128
      approx: 2.00e18
    - grid: 1-degree bins (360 per axis)
      formula: "360^9"
      exact: 101559956668416000000000
      approx: 1.02e23
    - grid: continuous real longitudes
      formula: null
      exact: null
      approx: uncountably infinite
  growth:
    over_time: fixed
    why: >-
      The space is fixed by definitions (9 grahas, 12 signs, 27 nakshatras);
      time only cycles planets through it. The ayanamsa drift (+50.29″/yr)
      shifts the tropical-to-sidereal mapping without changing the count.
      The count changed only when the framework itself admitted new bodies
      (adopting the outer planets would multiply the rashi level by 12).

# --- Example: one combination -------------------------------------------------
# The worked example from vedic-astrology-calculations.md §9, encoded as a
# single instance. All labels (rashi, nakshatra, pada, house, dasha) below are
# derivable from the sidereal longitudes using the domains above.
instance_example:
  birth:
    local: "1990-11-15T09:00:00+05:30"
    utc: "1990-11-15T03:30:00Z"
    julian_day_ut: 2448210.645833
    place: {name: New Delhi, latitude: 28.6139, longitude: 77.2090}
  ayanamsa: {school: lahiri, degrees: 23.729574}
  ascendant:
    tropical_deg: 260.9917
    sidereal_deg: 237.2621
    rashi: vrischika
    nakshatra: jyeshtha
    pada: 4
    house: 1
  grahas:
    - {graha: surya,   tropical_deg: 232.5040, sidereal_deg: 208.7744, rashi: tula,      nakshatra: vishakha,       pada: 3, house: 12}
    - {graha: chandra, tropical_deg: 207.8994, sidereal_deg: 184.1698, rashi: tula,      nakshatra: chitra,         pada: 4, house: 12}
    - {graha: mangala, tropical_deg: 70.0085,  sidereal_deg: 46.2790,  rashi: vrishabha, nakshatra: rohini,         pada: 2, house: 7}
    - {graha: budha,   tropical_deg: 246.2458, sidereal_deg: 222.5162, rashi: vrischika, nakshatra: anuradha,       pada: 3, house: 1}
    - {graha: guru,    tropical_deg: 133.2276, sidereal_deg: 109.4980, rashi: karka,     nakshatra: ashlesha,       pada: 1, house: 9}
    - {graha: shukra,  tropical_deg: 235.8944, sidereal_deg: 212.1649, rashi: vrischika, nakshatra: vishakha,       pada: 4, house: 1}
    - {graha: shani,   tropical_deg: 290.9217, sidereal_deg: 267.1921, rashi: dhanu,     nakshatra: uttara_ashadha, pada: 1, house: 2}
    - {graha: rahu,    tropical_deg: 300.7453, sidereal_deg: 277.0157, rashi: makara,    nakshatra: uttara_ashadha, pada: 4, house: 3}
    - {graha: ketu,    tropical_deg: 120.7453, sidereal_deg: 97.0157,  rashi: karka,     nakshatra: pushya,         pada: 2, house: 9}
  vimshottari_at_birth:
    moon: {nakshatra: chitra, pada: 4, elapsed_fraction: 0.8125}
    balance: {lord: mangala, years: 1.3125}
    then:
      - {lord: rahu,   years: 18}
      - {lord: guru,   years: 16}
      - {lord: shani,  years: 19}
      - {lord: budha,  years: 17}

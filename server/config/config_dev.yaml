http:
  port: "8081"
  read_timeout_in_second: 5
  write_timeout_in_second: 120
  idle_timeout_in_second: 120
  shutdown_timeout_in_second: 5
  max_body_size_in_bytes: 1048576

logger:
  level: debug
  sampling_initial: 100
  sampling_thereafter: 100

middleware:
  request_log:
    skip_paths: ["/health", "/books/events"]
    log_query: true
    query_allowlist: ["topic", "genre", "provider", "min_year", "max_year", "language", "min_popularity", "min_rating", "limit", "page"]
  rate_limit:
    enabled: true
    requests_per_second: 5
    burst: 20

sqlite:
  dsn: "trafae.db"

books:
  default_genre: "non-fiction"
  default_limit: 20
  cache_ttl_in_second: 300

providers:
  open_library_contact_email: ""
  gutenberg_catalog_url: "https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv.gz"
  search_timeout_in_second: 30
  search_timeouts_in_second:
    open_library: 20
    doab: 15
    gutendex: 25
    internet_archive: 25
    library_of_congress: 20
    wikidata: 30
    project_gutenberg: 10
